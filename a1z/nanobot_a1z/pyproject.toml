[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanobot-a1z"
version = "0.1.0"
description = "Galaxea A1Z arm control as a single aggregated nanobot tool (via local DimOS MCP server)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "nanobot-ai"]

[project.entry-points."nanobot.tools"]
a1z = "nanobot_a1z:A1ZTool"

[tool.setuptools]
py-modules = ["nanobot_a1z"]
